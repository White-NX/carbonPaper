[package]
name = "carbonpaper"
version = "0.9.2"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
rust-version = "1.100"
default-run = "carbonpaper"

[features]
app-bound-dev = ["carbonpaper-app-bound/development-runtime"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "carbonpaper_lib"
# The Windows desktop binaries consume the Rust library directly.
crate-type = ["rlib"]

[[bin]]
name = "carbonpaper-nmh"
path = "src/bin/nmh.rs"

[[bin]]
name = "carbonpaper-ml"
path = "src/bin/ml.rs"

[[bin]]
name = "carbonpaper-office"
path = "src/bin/office.rs"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }
walkdir = "2.5.0"
base64 = "0.22"

[dependencies]
carbonpaper-app-bound = { path = "app-bound" }
zeroize = "1"
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-opener = "2.7.3"
tauri-plugin-notification = "2.8.1"
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-dialog = "2.8.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
indexmap = { version = "2", features = ["serde"] }
regex = "1"
tokenizers = { version = "=0.21.4", default-features = false, features = ["fancy-regex"] }
thiserror = "1"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
winreg = "0.52"
which = "4.4"
runas = "1.2"
reqwest = { version = "0.11", features = ["blocking", "stream", "json"] }
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
anyhow = "1.0.100"
argon2 = "0.5"
percent-encoding = "2.3.2"
sysinfo = "0.30"
walkdir = "2.5.0"
rand = "0.8"
rusqlite = { version = "=0.42.0", default-features = false, features = [
    "cache",
    "hooks",
    "functions",
    "bundled-sqlcipher-vendored-openssl",
] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
iana-time-zone = "0.1"
aes-gcm = { version = "0.10", features = ["zeroize"] }
aead = { version = "0.5", features = ["stream"] }
aho-corasick = "1"
sha2 = "0.10"
md-5 = "0.10"
hmac = "0.12"
hex = "0.4"
ed25519-dalek = "2"
image = "0.25"
dirs = "5"
once_cell = "1.19"
roaring = "0.11.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
flate2 = "1"
window-vibrancy = "0.5"
raw-window-handle = "0.6"
open = "5"
rapidocr-core = { version = "=0.3.0", default-features = false, features = ["download-binaries", "tokio", "directml"] }
memmap2 = "0.9"
usearch = { version = "=2.26.0", default-features = false }

axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors"] }

[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.7"
windows = { version = "0.58", features = [
    "Foundation_Numerics",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Security_Authorization",
    "Win32_System_Memory",
    "Win32_System_SystemServices",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_System_Pipes",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_Performance",
    "Win32_System_ProcessStatus",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dwm",
    "Win32_UI_HiDpi",
    "Win32_UI_Controls",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_System_WinRT_Direct3D11",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D",
    "Win32_System_Power",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2.5.5"

[dev-dependencies]
tempfile = "3"
rusqlite = { version = "=0.42.0", default-features = false, features = ["functions"] }
tokio = { version = "1", features = ["test-util"] }

[lints.clippy]
undocumented_unsafe_blocks = "warn"

# Keep application backtraces useful without retaining full dependency symbols.
[profile.dev]
debug = 1
incremental = true

[profile.dev.package."*"]
debug = 0

# Optimize the concrete storage crypto entry point and its primitive callees.
# Generic AES code instantiated in the desktop crate would still run at opt=0.
# The desktop's application/session code keeps its ordinary debug profile.
[profile.dev.package.carbonpaper-app-bound]
opt-level = 3
debug = 1

[profile.dev.package.aes-gcm]
opt-level = 3

[profile.dev.package.aes]
opt-level = 3

[profile.dev.package.ctr]
opt-level = 3

[profile.dev.package.ghash]
opt-level = 3

[profile.dev.package.polyval]
opt-level = 3

[profile.dev.package.cipher]
opt-level = 3

[profile.dev.package.aead]
opt-level = 3

[profile.dev.package.crypto-common]
opt-level = 3

[profile.dev.package.universal-hash]
opt-level = 3

[profile.dev.package.base64]
opt-level = 3
