# Vendored from the published crate with ORT compatibility changes.
# See UPSTREAM.md for provenance and the scope of the patch.

[package]
edition = "2021"
rust-version = "1.92"
name = "rapidocr-core"
version = "0.2.2"
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Rust ONNX OCR core for RapidOCR-style detection, optional classification, and recognition pipelines"
readme = "README.md"
keywords = [
    "ocr",
    "onnx",
    "rapidocr",
    "paddleocr",
]
categories = [
    "computer-vision",
    "multimedia::images",
]
license = "Apache-2.0"
repository = "https://github.com/White-NX/rapidocr-rs"

[features]
default = ["model-download"]
directml = ["ort/directml"]
model-download = ["dep:reqwest"]
tokio = ["dep:tokio"]

[lib]
name = "rapidocr_core"
path = "src/lib.rs"

[[example]]
name = "library_usage"
path = "examples/library_usage.rs"

[[example]]
name = "tokio_usage"
path = "examples/tokio_usage.rs"
required-features = ["tokio"]

[dependencies.anyhow]
version = "1"

[dependencies.image]
version = "0.25"

[dependencies.imageproc]
version = "0.25"

[dependencies.ndarray]
version = "0.17"

[dependencies.ort]
version = "=2.0.0-rc.15"
default-features = true

[dependencies.reqwest]
version = "0.12"
features = [
    "blocking",
    "rustls-tls",
]
optional = true
default-features = false

[dependencies.serde]
version = "1"
features = ["derive"]

[dependencies.sha2]
version = "0.10"

[dependencies.thiserror]
version = "2"

[dependencies.tokio]
version = "1"
features = [
    "rt",
    "sync",
    "time",
]
optional = true

[dependencies.toml]
version = "0.8"

[dev-dependencies.ndarray-npy]
version = "0.10"

[dev-dependencies.serde_json]
version = "1"

[dev-dependencies.tokio]
version = "1"
features = [
    "macros",
    "rt-multi-thread",
    "sync",
    "time",
]
