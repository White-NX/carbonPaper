[package]
name = "carbonpaper-agent-access"
version = "0.1.0"
edition = "2021"

[features]
development-runtime = ["carbonpaper-app-bound/development-runtime"]

[profile.dev-service]
inherits = "dev"
opt-level = 2
debug = true

[[bin]]
name = "carbonpaper-mcp-reader"
path = "src/bin/reader.rs"

[dependencies]
carbonpaper-app-bound = { path = "../app-bound" }
aes-gcm = { version = "0.10", features = ["zeroize"] }
aho-corasick = "1"
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
hmac = "0.12"
once_cell = "1"
percent-encoding = "2.3"
rand = "0.8"
regex = "1"
roaring = "0.11.3"
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled-sqlcipher-vendored-openssl", "cache"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
