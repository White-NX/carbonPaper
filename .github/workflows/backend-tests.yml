name: Backend Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  frontend-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend lint
        run: npm run lint:ci

      - name: Run security guards
        run: npm run test:security

      - name: Build frontend
        run: npm run build

      - name: Run frontend unit tests
        run: npm run test:frontend

  app-bound-native:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache app-bound native dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri/app-bound -> target'

      - name: Run app-bound checks before release builds
        run: npm run test:app-bound:fast

      - name: Preserve native check results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-bound-native-results
          path: src-tauri/app-bound/target/native-checks/
          if-no-files-found: ignore

  backend-fast:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Run Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

