name: Backend Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      windows: ${{ steps.scope.outputs.windows }}

    steps:
      - name: Checkout PR merge and its parents
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"

      - name: Determine whether to run Windows checks
        id: scope
        run: node scripts/ci-check-scope.mjs

  frontend-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"
          cache: "npm"

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend lint
        run: npm run lint:ci

      - name: Run security guards
        run: npm run test:security

      - name: Check development runtime resources
        run: npm run test:dev-workers

      - name: Build frontend
        run: npm run build

      - name: Run frontend unit tests
        run: npm run test:frontend

      - name: Run CI scope tests
        run: node --test scripts/ci-check-scope.test.mjs

  app-bound-native:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.windows != 'false') }}
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"

      - name: Install Rust 1.100.0
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.100.0"

      - name: Cache app-bound native dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri/app-bound -> target'

      - name: Run app-bound checks before release builds
        run: npm run test:app-bound:fast

      - name: Preserve native check results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-bound-native-results
          path: src-tauri/app-bound/target/native-checks/
          if-no-files-found: ignore

  backend-fast:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.windows != 'false') }}
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.100.0
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.100.0"

      - name: Cache desktop and semantic worker dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            ./src-tauri -> target
            ./src-tauri/semantic-worker -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Run Rust unit tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib

      - name: Run Rust worker unit tests
        run: |
          cargo test --locked --manifest-path src-tauri/Cargo.toml --bins
          cargo test --locked --manifest-path src-tauri/semantic-worker/Cargo.toml

