name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.18.0

      - name: Install Rust 1.100.0
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.100.0"

      - name: Verify update signing secrets
        shell: pwsh
        env:
          CARBONPAPER_UPDATE_SIGNING_KEY: ${{ secrets.CARBONPAPER_UPDATE_SIGNING_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CARBONPAPER_UPDATE_SIGNING_KEY)) {
            throw "CARBONPAPER_UPDATE_SIGNING_KEY secret is required"
          }

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            ./src-tauri -> target
            ./src-tauri/app-bound -> target

      - name: Check app-bound before preparing and compiling release assets
        run: npm run test:app-bound:fast

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend lint
        run: npm run lint:ci

      - name: Run security guards
        run: npm run test:security

      - name: Restore release asset cache
        uses: actions/cache@v4
        with:
          path: .release-assets
          key: release-assets-${{ runner.os }}-${{ hashFiles('scripts/release-assets/ocr-models.json', 'scripts/release-assets/onnxruntime-directml.json') }}

      - name: Prepare release assets
        run: npm run prepare:release-assets

      - name: Build NMH binary
        run: npm run build:nmh:release

      - name: Build Rust OCR worker
        run: npm run build:ml:release

      - name: Build Office document worker
        run: npm run build:office:release

      - name: Build Rust semantic worker
        run: npm run build:semantic-ml:release

      - name: Build app-bound service
        run: npm run build:protected:release

      - name: Smoke test bundled Rust OCR runtime
        run: npm run verify:ml-runtime

      - name: Smoke test Office document worker
        run: npm run verify:office-runtime

      - name: Smoke test bundled Rust semantic runtime
        run: npm run verify:semantic-runtime

      - name: Verify staged release assets
        run: npm run test:release-assets

      - name: Build Tauri draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARBONPAPER_UPDATE_SIGNING_KEY: ${{ secrets.CARBONPAPER_UPDATE_SIGNING_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseDraft: true

      - name: Build portable and service repair packages
        env:
          CARBONPAPER_UPDATE_SIGNING_KEY: ${{ secrets.CARBONPAPER_UPDATE_SIGNING_KEY }}
        run: npm run pack:portable

      - name: Verify release assets after packaging
        run: npm run test:release-assets && npm run verify:release-bundles

      - name: Fetch Release Notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Try to fetch the release body created by the user or tauri-action
          $body = gh release view ${{ github.ref_name }} --json body -q .body
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($body)) { 
            $body = "Release ${{ github.ref_name }}" 
          }
          $body | Out-File -FilePath release_body.txt -Encoding utf8

      - name: Generate latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARBONPAPER_UPDATE_SIGNING_KEY: ${{ secrets.CARBONPAPER_UPDATE_SIGNING_KEY }}
          CARBONPAPER_UPDATE_PUBLIC_KEY_FILE: src-tauri/update-public-key.txt
        run: node scripts/generate-latest-json.mjs ${{ github.ref_name }} release_body.txt

      - name: Verify packaged update policy
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          ./scripts/update-smoke.ps1 -CandidateZip "src-tauri/target/release/bundle/nsis/carbonpaper_${version}_x64_portable.zip" -LatestJson "src-tauri/target/release/bundle/nsis/latest.json"

      - name: Run native update regressions
        shell: pwsh
        run: |
          cargo test --manifest-path src-tauri/app-bound/Cargo.toml --lib windows::update
          if ($LASTEXITCODE -ne 0) { throw "Native update regressions failed" }
          cargo test --manifest-path src-tauri/Cargo.toml --lib updater::tests
          if ($LASTEXITCODE -ne 0) { throw "Update verifier regressions failed" }

      - name: Upload portable and service repair assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $zipFile = "src-tauri/target/release/bundle/nsis/carbonpaper_${version}_x64_portable.zip"
          $latestJson = "src-tauri/target/release/bundle/nsis/latest.json"
          $repairZip = "src-tauri/target/release/bundle/nsis/carbonpaper_${version}_x64_service-repair.zip"
          $repairJson = "src-tauri/target/release/bundle/nsis/service-repair.json"
          gh release upload ${{ github.ref_name }} $zipFile $latestJson $repairZip $repairJson --clobber

      - name: Publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit ${{ github.ref_name }} --draft=false
