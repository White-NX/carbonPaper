<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/src/startup.css" />
    <title>CarbonPaper</title>
  </head>

  <body>
    <div id="root"></div>
    <section id="startup-screen" aria-label="CarbonPaper">
      <div class="startup-paper" aria-hidden="true"></div>
      <header class="startup-header" data-tauri-drag-region>
        <span class="startup-title">CarbonPaper</span>
        <div class="startup-controls">
          <button type="button" class="startup-window-control" data-startup-action="minimize">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14" /></svg>
          </button>
          <button type="button" class="startup-window-control" data-startup-action="hideToTray">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6" /></svg>
          </button>
        </div>
      </header>
      <div class="startup-brand">
        <h1 class="startup-wordmark">CarbonPaper</h1>
        <p class="startup-tagline" data-startup-tagline></p>
      </div>
      <img src="/src/assets/carbonpaper-mark.svg" width="32" height="32" alt="" data-startup-asset hidden />
    </section>
    <script src="/startup.js"></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
